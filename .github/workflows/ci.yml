name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tett23/adr-guard@v0.11.0
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          allow-status: true
          allow-links: true

  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git hash-object -w -t tree /dev/null)
          fi
          git diff --check "$BASE" "$HEAD"
          git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/paths"
          build=false
          while IFS= read -r -d '' path; do
            case "$path" in
              README|README.md|CONTRIBUTING|CONTRIBUTING.md|docs/specifications.md) ;;
              docs/adr/*.md|docs/audit/*.md|docs/audits/*.md|docs/benchmark/*.md|docs/benchmarks/*.md) ;;
              *) build=true ;;
            esac
          done < "$RUNNER_TEMP/paths"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libgit2-dev
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo test --locked
